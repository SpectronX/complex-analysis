[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpxmath"
version = "0.1.0"
description = "A python package that checks analyticity and visualise complex mappings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy", "numpy", "matplotlib"]